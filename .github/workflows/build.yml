name: Build CandyClient

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q CandyClient-1.4.5-HUD-Editor-Panel.zip -d source

      - name: Build
        run: gradle -p source/CandyClientMod build --no-daemon

      - name: Upload remapped JAR
        uses: actions/upload-artifact@v4
        with:
          name: CandyClient-1.4.5-Minecraft-1.21.11
          path: source/CandyClientMod/build/libs/CandyClient-*.jar
          if-no-files-found: error
