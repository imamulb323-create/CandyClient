name: Build CandyClient

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -q CandyClient-1.4.5-HUD-Editor-Panel.zip -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: |
          DIR=$(dirname "$(find source -name build.gradle -print -quit)")
          gradle -p "$DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CandyClient-JAR
          path: source/**/build/libs/*.jar
